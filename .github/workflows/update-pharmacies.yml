name: Update pharmacies de garde

# Met a jour pharmacies.json chaque jour (garde du jour) + lancement manuel.
on:
  schedule:
    - cron: '0 7,19 * * *'   # 07h00 et 19h00 UTC (08h/20h Maroc)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Scrape garde du jour
        run: python backend/scraper.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pharmacies.json
          if git diff --staged --quiet; then
            echo "Aucun changement aujourd'hui."
          else
            git commit -m "Garde du $(date -u +%F)"
            git push
          fi
